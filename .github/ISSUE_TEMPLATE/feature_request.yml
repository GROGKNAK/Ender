name: Feature request
description: A relay, element, export format or workflow Ender should support
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you need
      description: Describe the task, not the button. What are you trying to finish?
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - Support another relay model
        - Support another settings export format
        - Another protection element
        - Another test-set or report output
        - Workflow or usability
        - Something else
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: The manual process this would replace, if there is one.
