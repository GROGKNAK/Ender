name: CodeQL

# Code scanning is free on public repositories. If this repo is ever made
# private, CodeQL needs GitHub Advanced Security (paid) and this workflow will
# start failing — delete it at that point rather than paying for it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'   # Mondays, so a drifting advisory surfaces weekly

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze JavaScript
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
