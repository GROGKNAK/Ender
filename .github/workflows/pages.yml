name: Pages

# Publishes the UI mockups so they can be reviewed from a link instead of a
# screenshot. The same job is where a future web build drops in: point
# scripts/build-site.js at the web bundle and nothing else here changes.
#
# NOTE: GitHub Pages is free on PUBLIC repositories. On a private repository
# Pages needs a paid plan, and this workflow will fail at the deploy step until
# the repo is public or the plan is upgraded.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel a half-finished one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Build site
        run: node scripts/build-site.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
